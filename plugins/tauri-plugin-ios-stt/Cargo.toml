[package]
name = "tauri-plugin-ios-stt"
version = "0.1.0"
edition = "2021"
description = "iOS 裝置原生語音辨識（STT）plugin：SFSpeechRecognizer，預設粵語 zh-HK"
license = "MIT"
links = "tauri-plugin-ios-stt"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
