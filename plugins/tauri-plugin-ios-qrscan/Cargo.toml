[package]
name = "tauri-plugin-ios-qrscan"
version = "0.1.0"
edition = "2021"
description = "iOS 相機 QR 掃描 plugin（用嚟同 Mac 配對）"
license = "MIT"
links = "tauri-plugin-ios-qrscan"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
