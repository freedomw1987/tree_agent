[package]
name = "voice-agent-mac"
version = "0.1.0"
description = "Voice Agent macOS App（Tauri 2）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voice_agent_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
