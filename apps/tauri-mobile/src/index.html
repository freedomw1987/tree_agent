<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Voice Agent</title>
<style>
  /* ── Design Tokens（唯一來源：docs/DESIGN.md §4）────────────────── */
  :root {
    --background: #fbfbfd;
    --foreground: #16181d;
    --card: #ffffff;
    --muted: #f2f3f6;
    --muted-foreground: #6b7280;
    --primary: #2f6bff;
    --primary-foreground: #ffffff;
    --accent: #14b87a;
    --warning: #f5a524;
    --destructive: #e5484d;
    --border: #e4e6eb;
    --user-bubble: #2f6bff;
    --agent-bubble: #ffffff;
    --radius-control: 10px;
    --radius-card: 12px;
    --radius-panel: 16px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --shadow-pop: 0 12px 40px rgba(16,24,40,.16);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--background); color: var(--foreground);
    font-family: var(--font-sans); font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  button { font-family: inherit; cursor: pointer; }

  /* ── Header ───────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--card);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: transparent; color: var(--foreground); font-size: 18px;
    display: grid; place-items: center;
  }
  .icon-btn:active { background: var(--muted); }
  .title { flex: 1; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-foreground); }
  .dot.on { background: var(--accent); }
  .dot.busy { background: var(--warning); animation: pulse 1.2s infinite; }
  .dot.off { background: var(--destructive); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  /* ── 對話區 ──────────────────────────────────────────────────── */
  #stream {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px;
  }
  .bubble {
    max-width: 82%; padding: 9px 13px; border-radius: var(--radius-card);
    white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow-card);
  }
  .bubble.user { align-self: flex-end; background: var(--user-bubble); color: var(--primary-foreground); }
  .bubble.agent { align-self: flex-start; background: var(--agent-bubble); border: 1px solid var(--border); }
  .bubble.sys { align-self: center; background: var(--muted); color: var(--muted-foreground); font-size: 13px; }
  .bubble.err { align-self: flex-start; background: rgba(229,72,77,.08); color: var(--destructive); border: 1px solid rgba(229,72,77,.3); }
  .meta { font-size: 11px; color: var(--muted-foreground); margin: 2px 4px 0; align-self: flex-start; }
  .meta.right { align-self: flex-end; }

  /* 新訊息掣（睇緊歷史時出現） */
  #newMsg {
    position: absolute; right: 14px; bottom: 96px; z-index: 5;
    background: var(--primary); color: #fff; border: none;
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
    box-shadow: var(--shadow-pop); display: none;
  }

  /* ── 底部輸入（浮動）─────────────────────────────────────────── */
  #composer {
    flex: 0 0 auto; background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 10px;
  }
  #composer.hidden { display: none; }
  #input {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius-control);
    padding: 9px 12px; font-size: 16px; /* 16px 避免 iOS 自動放大 */
    font-family: inherit; background: var(--background); color: var(--foreground);
    max-height: 120px; min-height: 40px;
  }
  #input:focus { outline: 2px solid rgba(47,107,255,.35); outline-offset: 1px; }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--muted); color: var(--foreground); font-size: 19px;
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .round:active { background: var(--border); }
  #sendBtn { background: var(--primary); color: #fff; }
  #micBtn { background: var(--primary); color: #fff; }
  #micBtn.recording { background: var(--destructive); animation: pulse 1s infinite; }
  #holdBtn {
    flex: 1; height: 44px; border-radius: 22px; border: none;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 500;
    touch-action: none; user-select: none;
  }
  #holdBtn.recording { background: var(--destructive); }

  /* ── 確認卡（跨機風險閘）────────────────────────────────────── */
  .confirm-card {
    align-self: stretch; background: var(--card); border: 1px solid rgba(245,165,36,.5);
    border-radius: var(--radius-card); padding: 12px 14px; display: flex;
    flex-direction: column; gap: 9px; box-shadow: var(--shadow-card);
  }
  .confirm-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .risk-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .risk-write { color: #8a5a00; border-color: rgba(245,165,36,.6); background: rgba(245,165,36,.12); }
  .risk-external_effect { color: var(--destructive); border-color: rgba(229,72,77,.5); background: rgba(229,72,77,.1); }
  .confirm-preview {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; max-height: 180px; overflow: auto; background: rgba(0,0,0,.04);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
  }
  .confirm-actions { display: flex; gap: 9px; }
  .confirm-actions button { flex: 1; border-radius: var(--radius-control); border: 1px solid var(--border); background: var(--muted); padding: 10px; font-size: 14px; }
  .confirm-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ── 抽屜（session）─────────────────────────────────────────── */
  #scrim { position: fixed; inset: 0; background: rgba(16,24,40,.35); z-index: 20; display: none; }
  #drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 78%; max-width: 320px;
    background: var(--card); z-index: 21; transform: translateX(-100%);
    transition: transform .22s ease; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head { padding: 14px 16px 10px; font-weight: 600; border-bottom: 1px solid var(--border); }
  #sessions { flex: 1; overflow-y: auto; padding: 8px; }
  .session {
    padding: 10px 12px; border-radius: var(--radius-control); margin-bottom: 4px;
    font-size: 14px; display: flex; justify-content: space-between; gap: 8px;
  }
  .session.active { background: rgba(47,107,255,.1); color: var(--primary); font-weight: 500; }
  .session span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session span.c { color: var(--muted-foreground); font-size: 12px; flex: 0 0 auto; }
  .drawer-foot { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn {
    flex: 1; border-radius: var(--radius-control); border: 1px solid var(--border);
    background: var(--card); color: var(--foreground); padding: 11px 12px; font-size: 14px;
  }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ── 設定 sheet ─────────────────────────────────────────────── */
  #settings {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--card); border-radius: var(--radius-panel) var(--radius-panel) 0 0;
    box-shadow: var(--shadow-pop); padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .22s ease;
  }
  #settings.open { transform: translateY(0); }
  #settings h3 { margin: 0 0 12px; font-size: 16px; }
  #settings label { display: block; font-size: 12px; color: var(--muted-foreground); margin: 10px 0 4px; }
  #settings input {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-control);
    padding: 10px 12px; font-size: 14px; font-family: inherit; background: var(--background);
  }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .hint { font-size: 12px; color: var(--muted-foreground); margin-top: 8px; line-height: 1.45; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="對話列表">☰</button>
    <div class="title" id="title">新對話</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">未連接</span></div>
    <button class="icon-btn" id="gearBtn" aria-label="設定">⚙</button>
  </header>

  <div id="stream"></div>
  <button id="newMsg">⬇ 新訊息</button>

  <div id="composer">
    <button class="round" id="modeBtn" aria-label="切換輸入模式">⌨</button>
    <textarea id="input" rows="1" placeholder="講嘢或者打字…"></textarea>
    <button class="round" id="sendBtn" aria-label="送出">➤</button>
    <button class="round" id="micBtn" aria-label="按住說話" style="display:none">🎤</button>
    <button id="holdBtn" style="display:none">按住 說話</button>
  </div>

  <div id="scrim"></div>
  <aside id="drawer">
    <div class="drawer-head">對話</div>
    <div id="sessions"></div>
    <div class="drawer-foot">
      <button class="btn primary" id="newChatBtn">＋ 開新對話</button>
    </div>
  </aside>

  <div id="settings">
    <h3>連接 Mac</h3>
    <label>Relay API URL</label>
    <input id="apiUrl" placeholder="https://xxxx.execute-api.ap-southeast-1.amazonaws.com" />
    <label>Token</label>
    <input id="apiToken" placeholder="va_live_…" />
    <div class="row">
      <button class="btn" id="cancelSettings">取消</button>
      <button class="btn primary" id="saveSettings">儲存並連接</button>
    </div>
    <div class="hint">手機唔會直接跑 Agent：任務經呢度派去你 Mac 上面嘅 sidecar 執行，結果再返嚟。</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const stream = $("stream");

  let relayReady = false;
  let polling = null;
  let mode = "voice";           // voice | keyboard
  let atBottom = true;
  let sessions = [];

  // ── 訊息 ───────────────────────────────────────────────────────
  function addBubble(kind, text, meta) {
    const div = document.createElement("div");
    div.className = "bubble " + kind;
    div.textContent = text;
    stream.appendChild(div);
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta" + (kind === "user" ? " right" : "");
      m.textContent = meta;
      stream.appendChild(m);
    }
    if (atBottom) stream.scrollTop = stream.scrollHeight;
    return div;
  }
  function setStatus(kind, text) {
    const dot = $("dot");
    dot.className = "dot" + (kind === "on" ? " on" : kind === "busy" ? " busy" : kind === "off" ? " off" : "");
    $("statusText").textContent = text;
  }
  const now = () => new Date().toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit" });

  // ── Sticky scroll（底部自動滾；睇歷史時保留位置 ＋「新訊息」掣）──
  stream.addEventListener("scroll", () => {
    atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 40;
    $("newMsg").style.display = atBottom ? "none" : "block";
  });
  $("newMsg").onclick = () => { stream.scrollTop = stream.scrollHeight; atBottom = true; $("newMsg").style.display = "none"; };

  // ── 輸入模式切換 ────────────────────────────────────────────────
  function setMode(next) {
    mode = next;
    const voice = mode === "voice";
    $("input").style.display = voice ? "none" : "block";
    $("sendBtn").style.display = voice ? "none" : "grid";
    $("holdBtn").style.display = voice ? "block" : "none";
    $("modeBtn").textContent = voice ? "⌨" : "🎤";
  }
  $("modeBtn").onclick = () => setMode(mode === "voice" ? "keyboard" : "voice");

  // ── 送出 ────────────────────────────────────────────────────────
  async function sendText(text) {
    if (!text.trim()) return;
    addBubble("user", text, now());
    if (!relayReady) {
      addBubble("sys", "未連接 Mac：撳右上 ⚙ 填 API URL 同 token");
      return;
    }
    setStatus("busy", "派緊任務…");
    let requestId;
    try {
      const res = await window.__TAURI__.core.invoke("relay_send", { text });
      requestId = res.requestId;
    } catch (e) {
      setStatus("off", "派任務失敗");
      addBubble("err", "派任務失敗：" + e);
      return;
    }
    pollResult(requestId);
  }

  // ── 跨機確認卡（手機批核 Mac 上面嘅工具調用）──────────────────
  let shownConfirmId = null;
  async function showConfirmCard(requestId, confirm) {
    if (shownConfirmId === confirm.id) return;
    shownConfirmId = confirm.id;
    const old = document.getElementById("confirm-card");
    if (old) old.remove();

    const card = document.createElement("div");
    card.className = "confirm-card";
    card.id = "confirm-card";
    const risk = confirm.risk_level || "write";
    const label = risk === "external_effect" ? "外部影響" : "會改動";
    card.innerHTML =
      '<div class="confirm-head">' +
      '<span class="risk-badge risk-' + risk + '">' + label + "</span>" +
      "<strong>" + escapeHtml(confirm.tool_label || confirm.tool_name || "工具") + "</strong></div>";
    const preview = document.createElement("div");
    preview.className = "confirm-preview";
    preview.textContent = confirm.preview || "（冇預覽內容）";
    const actions = document.createElement("div");
    actions.className = "confirm-actions";
    const ok = document.createElement("button");
    ok.className = "primary";
    ok.textContent = "確認執行";
    ok.onclick = () => respondConfirm(requestId, true, card);
    const no = document.createElement("button");
    no.textContent = "取消";
    no.onclick = () => respondConfirm(requestId, false, card);
    actions.append(ok, no);
    card.append(preview, actions);
    stream.appendChild(card);
    if (atBottom) stream.scrollTop = stream.scrollHeight;
    setStatus("busy", "等你批核");
  }
  async function respondConfirm(requestId, approved, card) {
    try {
      await window.__TAURI__.core.invoke("relay_confirm", { requestId, approved });
      shownConfirmId = null;
      if (card) card.remove();
      addBubble("sys", approved ? "✅ 已批核，等 Mac 繼續" : "🚫 已取消");
    } catch (e) {
      addBubble("err", "回覆確認失敗：" + e);
    }
  }

  function pollResult(requestId) {
    if (polling) clearInterval(polling);
    let tries = 0;
    polling = setInterval(async () => {
      tries++;
      if (tries > 300) { clearInterval(polling); polling = null; setStatus("on", "已就緒"); return; }
      try {
        const t = await window.__TAURI__.core.invoke("relay_poll", { requestId });
        if (t.confirm && !t.confirm.decision) {
          showConfirmCard(requestId, t.confirm);
        }
        if (t.status === "completed" || t.status === "failed" || t.status === "partial") {
          clearInterval(polling); polling = null;
          if (t.result) addBubble("agent", t.result, now());
          else if (t.error) addBubble("err", t.error, now());
          setStatus("on", "已就緒");
        } else {
          setStatus("busy", "Agent 做緊…");
        }
      } catch (e) {
        clearInterval(polling); polling = null;
        setStatus("off", "連接中斷");
        addBubble("err", "查結果失敗：" + e);
      }
    }, 1500);
  }

  $("sendBtn").onclick = () => { const t = $("input").value; $("input").value = ""; sendText(t); };
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const t = $("input").value; $("input").value = ""; sendText(t); }
  });
  $("input").addEventListener("input", () => {
    const el = $("input");
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  });

  // ── 按住說話（STT plugin；冇 plugin 就退回鍵盤）──────────────────
  let holding = false;
  const holdBtn = $("holdBtn");
  async function sttStart() {
    if (holding) return;
    holding = true;
    holdBtn.classList.add("recording");
    holdBtn.textContent = "聽緊… 放開送出";
    try {
      await window.__TAURI__.core.invoke("stt_start");
    } catch (e) {
      holding = false;
      holdBtn.classList.remove("recording");
      holdBtn.textContent = "按住 說話";
      setMode("keyboard");
      addBubble("sys", "語音輸入未安裝（用鍵盤打）");
    }
  }
  async function sttStop() {
    if (!holding) return;
    holding = false;
    holdBtn.classList.remove("recording");
    holdBtn.textContent = "按住 說話";
    try {
      const text = await window.__TAURI__.core.invoke("stt_stop");
      if (text) sendText(text);
    } catch (e) { /* 已經停咗 */ }
  }
  holdBtn.addEventListener("touchstart", (e) => { e.preventDefault(); sttStart(); }, { passive: false });
  holdBtn.addEventListener("touchend", (e) => { e.preventDefault(); sttStop(); }, { passive: false });
  holdBtn.addEventListener("mousedown", (e) => { e.preventDefault(); sttStart(); });
  window.addEventListener("mouseup", () => { if (holding) sttStop(); });

  // ── 抽屜 ────────────────────────────────────────────────────────
  const drawer = $("drawer"), scrim = $("scrim");
  function openDrawer() { drawer.classList.add("open"); scrim.style.display = "block"; }
  function closeDrawer() { drawer.classList.remove("open"); scrim.style.display = "none"; }
  $("menuBtn").onclick = openDrawer;
  scrim.onclick = closeDrawer;
  $("newChatBtn").onclick = () => { closeDrawer(); $("title").textContent = "新對話"; addBubble("sys", "開咗新對話（標題會由 Agent 自動命名）"); };

  function renderSessions() {
    const box = $("sessions");
    box.innerHTML = "";
    if (!sessions.length) {
      const d = document.createElement("div");
      d.className = "session";
      d.innerHTML = '<span class="t">（仲未有對話）</span>';
      box.appendChild(d);
      return;
    }
    sessions.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "session" + (i === 0 ? " active" : "");
      d.innerHTML = `<span class="t">${escapeHtml(s.title)}</span><span class="c">${s.count ?? 0}</span>`;
      d.onclick = () => { closeDrawer(); $("title").textContent = s.title; };
      box.appendChild(d);
    });
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ── 設定 ────────────────────────────────────────────────────────
  $("gearBtn").onclick = () => $("settings").classList.add("open");
  $("cancelSettings").onclick = () => $("settings").classList.remove("open");
  $("saveSettings").onclick = async () => {
    const apiUrl = $("apiUrl").value.trim();
    const token = $("apiToken").value.trim();
    if (!apiUrl || !token) { addBubble("err", "API URL 同 token 都要填"); return; }
    try {
      await window.__TAURI__.core.invoke("relay_configure", { apiUrl, token });
      relayReady = true;
      setStatus("on", "已連接");
      $("settings").classList.remove("open");
      localStorage.setItem("va_api_url", apiUrl);
      localStorage.setItem("va_token", token);
      addBubble("sys", "已連接 Mac ✅");
      loadTranscript();
    } catch (e) {
      addBubble("err", "設定失敗：" + e);
    }
  };

  async function loadTranscript() {
    try {
      const page = await window.__TAURI__.core.invoke("relay_transcript", { cursor: null });
      (page.entries || []).forEach((e) => {
        addBubble(e.role === "user" ? "user" : "agent", e.content, new Date(e.ts).toLocaleTimeString("zh-HK", { hour: "2-digit", minute: "2-digit" }));
      });
    } catch (e) { /* 未連線 */ }
  }

  // ── 啟動 ────────────────────────────────────────────────────────
  (async function init() {
    setMode("voice");
    renderSessions();
    const savedUrl = localStorage.getItem("va_api_url");
    const savedToken = localStorage.getItem("va_token");
    if (savedUrl && savedToken) {
      $("apiUrl").value = savedUrl;
      $("apiToken").value = savedToken;
      try {
        await window.__TAURI__.core.invoke("relay_configure", { apiUrl: savedUrl, token: savedToken });
        relayReady = true;
        setStatus("on", "已連接");
        loadTranscript();
      } catch (e) { /* 之后再连 */ }
    } else {
      setStatus("off", "未連接");
    }
  })();
</script>
</body>
</html>
