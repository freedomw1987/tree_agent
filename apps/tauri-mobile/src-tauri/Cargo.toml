[package]
name = "voice-agent-mobile"
version = "0.1.0"
description = "Voice Agent 手機 App（Tauri 2：iOS / Android）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voice_agent_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# 編譯時開啟：啟動就跑真跨機自檢（派任務 → relay → Mac sidecar → 結果）
selftest = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
